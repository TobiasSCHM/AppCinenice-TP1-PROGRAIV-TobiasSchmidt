<section class="tarjeta formulario-angosto">
  <h2>Ingresar</h2>

  <form [formRoot]="formulario" (submit)="$event.preventDefault()">
    <div class="campo">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" [formField]="formulario.email" />
      <app-errores-campo [estado]="formulario.email()" />
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" [formField]="formulario.password" />
      <app-errores-campo [estado]="formulario.password()" />
    </div>

    @if (errorEnvio(); as e) {
      <p class="error" role="alert">{{ e }}</p>
    }

    <div class="fila-acciones">
      <button type="submit" class="boton" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </div>
  </form>

  <p class="separador">o</p>
  <button type="button" class="boton boton-secundario" (click)="conGoogle()">Continuar con Google</button>

  <p class="ayuda">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
</section>
